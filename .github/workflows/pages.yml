name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'examples/afterimage/**', 'loupe/**', 'mcp/**', 'tools/build_showcase.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build playable showcase
        run: |
          npm install --prefix .webtools love.js@11.4.1
          python3 tools/build_showcase.py --builder .webtools/node_modules/.bin/love.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
