<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04090d"><title>Afterimage · The Glass Reach</title>
<link rel="stylesheet" href="theme/love.css">
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Afterimage game. WASD or arrows move; Space pulse; Tab pause; V switches art; M mutes sound."></canvas>
<section id="start" aria-label="Start Afterimage">
<img src="afterimage-logo.png" alt="Afterimage: The Glass Reach">
<div><button id="launch" disabled>Loading flight systems…</button></div>
<p id="status" role="status">Preparing flight systems…</p>
</section>
<button id="fullscreen" aria-label="Enter fullscreen" title="Fullscreen (F11)" hidden>⛶</button>
<script>
// Analytics. The build writes the public key here from RAVENSIGHT_PUBLIC_KEY; a
// fork or a local build has none, and then the bridge is a sink: the game runs
// the same and nothing is sent. Nothing is sent before the player switches
// ANALYTICS on inside the game either, and the page's SDK is not even
// constructed until then (no device id stored, no request). The game's save
// folder owns the choice: the page starts its SDK only on the game's own
// "enabled true" line and never reads or writes the choice in localStorage,
// which every page on this origin shares.
const RAVENSIGHT_PUBLIC_KEY='{{RAVENSIGHT_PUBLIC_KEY}}';
const RAVENSIGHT_API_URL='{{RAVENSIGHT_API_URL}}';
const AFTERIMAGE_VERSION='{{AFTERIMAGE_VERSION}}';
const canvas=document.getElementById('canvas');
const start=document.getElementById('start');
const status=document.getElementById('status');
const full=document.getElementById('fullscreen');
let started=false, runtimeReady=false;
let pixelBudget=2560*1440, sampleStart=0, frameCount=0, slowSamples=0;
var Module={
  htmlFullscreen:true, arguments:['./game.love'], INITIAL_MEMORY:268435456, canvas,
  printErr:console.error.bind(console),
  setStatus(text){if(text)status.textContent=text;},
  monitorRunDependencies(left){status.textContent=left?'Loading game assets…':'Ready for launch';},
  onRuntimeInitialized(){runtimeReady=true; requestAnimationFrame(fit);}
};
function fit(){
  if(!started||!runtimeReady||!Module.setCanvasSize)return;
  // Bound total fill cost on large Retina displays while preserving the aspect ratio.
  const ratio=Math.min(window.devicePixelRatio||1,2,Math.sqrt(pixelBudget/(window.innerWidth*window.innerHeight)));
  const w=Math.max(1,Math.round(window.innerWidth*ratio));
  const h=Math.max(1,Math.round(window.innerHeight*ratio));
  const size=w+' '+h;
  if(Module.FS&&Module.lastWindowSize!==size){
    Module.FS.writeFile('/tmp/afterimage-window.txt',size);
    Module.lastWindowSize=size;
  }
  canvas.dataset.renderSize=size;
  canvas.style.width='100%';canvas.style.height='100%';
}
// A client that constructs the SDK at the player's first yes. The bridge only
// calls these members (ravensight-love 0.3.0 with ravensight-js 0.4.x).
function lazyRavensight(make){
  let rs=null, starting=null;
  return {
    // True from the first init() call, so a second "enabled true" line never
    // starts a second settings check and session.
    get initialized(){return Boolean(starting)||(rs?rs.initialized:false);},
    get _inflightSize(){return rs?rs._inflightSize:0;},
    track(event,data){return rs?rs.track(event,data):undefined;},
    submitFeedback(...args){return rs?rs.submitFeedback(...args):Promise.resolve(false);},
    setEnabled(value){if(value&&!rs)rs=make();if(rs)rs.setEnabled(value);},
    init(){if(!rs)return Promise.resolve(null);if(!starting)starting=rs.init();return starting;},
    flush(){return rs?rs.flush():Promise.resolve(0);},
    _flushOnHidden(offset){if(!rs)return false;return typeof rs._flushOnHidden==='function'?rs._flushOnHidden(offset):rs.flush();}
  };
}
function silenceTaggedLines(){
  const print=Module.print||console.log.bind(console);
  Module.print=(...args)=>{if(args.length===1&&typeof args[0]==='string'&&args[0].startsWith('__RAVENSIGHT__ '))return;return print(...args);};
}
// love.js copies the save directory to IndexedDB only on beforeunload, which a
// closing tab may not finish. Copy it as soon as the player's analytics choice
// (written by the game before it prints the line) or a setting changes hands,
// and whenever the tab is hidden, so the choice survives the next visit.
function persistSaves(){try{if(Module.FS&&Module.FS.syncfs)Module.FS.syncfs(false,error=>{if(error)console.warn('Save sync failed:',error);});}catch(error){}}
// The game prints its first tagged line from love.load, which love.js runs only
// after the save folder was loaded from IndexedDB. Before that, a sync would
// overwrite the stored folder with an empty one.
let savesLoaded=false;
function watchChoiceLines(){
  const print=Module.print;
  Module.print=(...args)=>{
    const text=args[0];
    const tagged=typeof text==='string'&&text.startsWith('__RAVENSIGHT__ ');
    if(tagged)savesLoaded=true;
    const result=print(...args);
    if(tagged&&text.includes('"op":"enabled"'))setTimeout(persistSaves,0);
    return result;
  };
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&savesLoaded)persistSaves();});
let bridgeReady=null;
function prepareAnalytics(){
  if(bridgeReady)return bridgeReady;
  bridgeReady=(async()=>{
    const bridge=await import('./ravensight-love-bridge.js');
    const key=/^gt_pub_[A-Za-z0-9_-]{16,64}$/.test(RAVENSIGHT_PUBLIC_KEY)?RAVENSIGHT_PUBLIC_KEY:'';
    if(!key){bridge.installRavensightBridge(null,Module);return 'sink';}
    const {default:Ravensight}=await import('./ravensight/index.js');
    const options={ingestKey:key,gameVersion:AFTERIMAGE_VERSION};
    if(/^https?:\/\//.test(RAVENSIGHT_API_URL))options.apiUrl=RAVENSIGHT_API_URL;
    const client=lazyRavensight(()=>new Ravensight(options));
    // storage: null keeps the bridge off localStorage; the game's line decides.
    bridge.installRavensightBridge(client,Module,{consent:'opt_in',storage:null});
    return 'live';
  })().catch(error=>{
    console.warn('Analytics unavailable:',error&&error.message);
    silenceTaggedLines();
    return 'failed';
  });
  bridgeReady.then(mode=>{document.documentElement.dataset.analytics=mode;});
  return bridgeReady;
}
function unlockAudio(){const context=Module.SDL2&&Module.SDL2.audioContext;if(context&&context.state==='suspended')context.resume();}
async function toggleFullscreen(){
  try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}
  catch(error){status.textContent='Fullscreen unavailable here. Open the game in its own tab.';}
  fit();canvas.focus();
}
async function launch(fullscreen){
  if(started)return;
  if(fullscreen)await toggleFullscreen();
  started=true;start.hidden=true;full.hidden=false;
  // The bridge must wrap Module.print before Love(Module) reads it.
  await prepareAnalytics();
  watchChoiceLines();
  Love(Module);canvas.focus();
  // The initial LÖVE window setup follows runtime initialization; settle both on the next frames.
  function settle(now){
    if(!sampleStart)sampleStart=now;
    frameCount++;
    if(now-sampleStart>=1000){
      const fps=frameCount*1000/(now-sampleStart);
      canvas.dataset.frameRate=Math.round(fps);
      slowSamples=!document.hidden&&fps<45?slowSamples+1:0;
      if(slowSamples>=3&&pixelBudget>1440*900){
        pixelBudget=Math.max(1440*900,Math.round(pixelBudget*.75));
        slowSamples=0;
      }
      frameCount=0;sampleStart=now;fit();
    }
    requestAnimationFrame(settle);
  }requestAnimationFrame(settle);
  unlockAudio();
}
function applicationLoad(){
  prepareAnalytics();
  document.getElementById('launch').disabled=false;document.getElementById('launch').textContent='Play';
  status.textContent='';
}
document.getElementById('launch').onclick=()=>launch(false);
full.onclick=toggleFullscreen;
window.addEventListener('resize',fit);
document.addEventListener('fullscreenchange',fit);
window.addEventListener('pointerdown',unlockAudio);
// Restore keyboard ownership when returning to the embedded canvas.
canvas.addEventListener('pointerdown',()=>canvas.focus({preventScroll:true}));
window.addEventListener('focus',()=>{if(started)canvas.focus({preventScroll:true});});
window.addEventListener('keydown',event=>{
  unlockAudio();
  if(event.key==='F11'){event.preventDefault();event.stopImmediatePropagation();toggleFullscreen();}
  else if((event.key==='Tab'&&document.activeElement===canvas)||[' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key))event.preventDefault();
},true);
canvas.addEventListener('webglcontextlost',event=>{event.preventDefault();start.hidden=false;status.textContent='Graphics context lost. Reload to restart.';});
window.addEventListener('error',()=>{start.hidden=false;status.textContent='The game could not start. Reload or try the native download.';});
</script>
<script src="game.js"></script><script async src="love.js" onload="applicationLoad()"></script>
</body></html>
